name: Build Ionic Android APK # Name of the build process

on:
  push:
    branches:
      - main # Builds when changes are pushed to main

  workflow_dispatch: # Allows manual build

jobs:
  build-apk:
    runs-on: ubuntu-latest # Uses a Linux system for building

    steps:

      # Gets the project from GitHub
      - name: Checkout project
        uses: actions/checkout@v4

      # Sets the Node.js version for the project
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Installs all required project packages
      - name: Install npm dependencies
        run: npm ci

      # Builds the Ionic and Vue application
      - name: Build School Organization application
        run: npm run build

      # Sets up Java needed by Android
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Checks if Java is installed correctly
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Updates the Android project with the latest app files
      - name: Sync Capacitor Android
        run: npx cap sync android

      # Allows Gradle to run
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # Checks the Gradle version
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # Creates the Android debug APK
      - name: Build School Organization Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # Creates the final APK file for the project
      - name: Prepare School Organization APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SchoolOrganization.apk

      # Uploads the APK so it can be downloaded from GitHub
      - name: Upload School Organization APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolOrganization-APK
          path: SchoolOrganization.apk
          if-no-files-found: error
          retention-days: 30